# Entra ID Auth SDK (sidecar) running next to the agent.
# Bound to localhost only: the docs say never expose the sidecar externally.
services:
  sidecar:
    image: mcr.microsoft.com/entra-sdk/auth-sidecar:1.0.0   # if the tag is not found, use :latest
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      AzureAd__Instance: "https://login.microsoftonline.com/"
      AzureAd__TenantId: "${TENANT_ID}"
      AzureAd__ClientId: "${BLUEPRINT_APP_ID}"          # the agent identity BLUEPRINT's app ID
      AzureAd__ClientCredentials__0__SourceType: "ClientSecret"   # local demo only, use FIC or a certificate in production
      AzureAd__ClientCredentials__0__ClientSecret: "${BLUEPRINT_SECRET}"
      DownstreamApis__Graph__BaseUrl: "https://graph.microsoft.com/v1.0"
      DownstreamApis__Graph__Scopes: "User.Read"
